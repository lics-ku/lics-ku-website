name: Update publications

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:pubs
      - run: npm run update:pubs

      - id: publications
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo 'body<<EOF'
            echo '## 자동 분류된 OpenAlex 논문'
            echo
            git diff --unified=0 -- data/publications/publications.json |
              grep -E '^\+      "(title|status)":' |
              sed -E \
                -e 's/^\+      "title": "(.*)",$/- \1/' \
                -e 's/^\+      "status": "(.*)",$/  - 자동 판정: \1/' || true
            echo
            echo '`verified`는 강한 다중 신호로 자동 승인된 항목이므로 표본 확인합니다.'
            echo '`pending`은 원문을 확인해 맞으면 `verified`로 바꾸고, 무관하면 항목 전체를 삭제합니다.'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-publications
          delete-branch: true
          commit-message: "chore(publications): add classified OpenAlex works"
          title: "chore(publications): review classified OpenAlex works"
          body: ${{ steps.publications.outputs.body }}
          labels: publications, automated
